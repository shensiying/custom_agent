<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 文档管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 36px;
        }
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            transition: border-color 0.3s, background 0.3s;
            cursor: pointer;
            position: relative;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #818cf8;
            background: rgba(129,140,248,0.06);
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .upload-zone p {
            font-size: 15px;
            color: #aaa;
        }
        .upload-zone .hint {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }
        button[type="submit"] {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }
        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        #status {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            line-height: 1.6;
        }
        #status.success {
            background: rgba(52,211,153,0.12);
            border: 1px solid rgba(52,211,153,0.3);
            color: #6ee7b7;
            display: block;
        }
        #status.error {
            background: rgba(248,113,113,0.12);
            border: 1px solid rgba(248,113,113,0.3);
            color: #fca5a5;
            display: block;
        }
        #status.loading {
            background: rgba(251,191,36,0.12);
            border: 1px solid rgba(251,191,36,0.3);
            color: #fcd34d;
            display: block;
        }
        .file-name {
            margin-top: 12px;
            font-size: 13px;
            color: #818cf8;
            display: none;
        }
        .divider {
            margin: 36px 0;
            border: none;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .cache-section h2 {
            font-size: 16px;
            color: #999;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .cache-section pre {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 10px;
            font-size: 12px;
            color: #888;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .links {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            font-size: 13px;
        }
        .links a {
            color: #818cf8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .links a:hover { color: #a78bfa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RAG 文档管理</h1>
        <p class="subtitle">上传文档 · 自动切片 · 语义检索</p>

        <form id="upload-form">
            <div class="upload-zone" id="drop-zone">
                <div class="upload-icon">&#128196;</div>
                <p>拖拽文档到此处，或点击选择</p>
                <p class="hint">支持 TXT / PDF / DOCX / MD</p>
                <input type="file" name="file" id="file-input" accept=".txt,.pdf,.docx,.md" required>
            </div>
            <div class="file-name" id="file-name"></div>
            <button type="submit" id="submit-btn">上传并入库</button>
        </form>

        <div id="status"></div>

        <hr class="divider">

        <div class="cache-section">
            <h2>已入库文档</h2>
            <pre>{{ cache_display or '（暂无文档）' }}</pre>
        </div>

        <div class="links">
            <a href="/docs">API 文档</a>
            <a href="/stats">统计信息</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileName = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', () => {
            const f = fileInput.files[0];
            fileName.textContent = f ? '已选择: ' + f.name : '';
            fileName.style.display = f ? 'block' : 'none';
        });

        ['dragenter','dragover','dragleave','drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => e.preventDefault());
        });
        ['dragenter','dragover'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.add('dragover'));
        });
        ['dragleave','drop'].forEach(evt => {
            dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'));
        });
        dropZone.addEventListener('drop', e => {
            fileInput.files = e.dataTransfer.files;
            fileInput.dispatchEvent(new Event('change'));
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            const fd = new FormData();
            fd.append('file', file);

            submitBtn.disabled = true;
            submitBtn.textContent = '处理中...';
            status.className = 'loading';
            status.textContent = '正在上传并处理文档...';
            status.style.display = 'block';

            try {
                const res = await fetch('/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (res.ok) {
                    if (data.status === 'duplicate') {
                        status.className = 'success';
                        status.textContent = data.message;
                    } else {
                        status.className = 'success';
                        status.innerHTML = '上传成功！<br>文件: ' + data.filename +
                            '<br>切片数: ' + data.chunks;
                        setTimeout(() => location.reload(), 1500);
                    }
                } else {
                    status.className = 'error';
                    status.textContent = '上传失败: ' + (data.detail || res.statusText);
                }
            } catch (err) {
                status.className = 'error';
                status.textContent = '网络错误: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '上传并入库';
            }
        });
    </script>
</body>
</html>
